<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spring Valley CRM</title>
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --ink: #24301f;
    --muted: #6b7a63;
    --accent: #3c6e47;
    --accent-dark: #2a4e32;
    --border: #e1ddd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px;
    background: var(--accent-dark);
    color: #f2f2ea;
    padding: 24px 16px;
    flex-shrink: 0;
  }
  .brand-name { font-size: 1.3rem; font-weight: 700; }
  .brand-sub { font-size: 0.8rem; opacity: 0.8; margin-bottom: 24px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
  .sidebar nav button {
    all: unset;
    cursor: pointer;
    color: #e6e6dd;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 0.95rem;
  }
  .sidebar nav button:hover { background: rgba(255,255,255,0.08); }
  .sidebar nav button.active { background: var(--accent); color: #fff; font-weight: 600; }
  .content { flex: 1; padding: 32px 40px; max-width: 1100px; }
  h1 { margin-top: 0; }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin: 24px 0;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
  }
  .card-value { font-size: 1.6rem; font-weight: 700; color: var(--accent-dark); }
  .card-label { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-top: 12px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  th { background: #eef2ea; color: var(--accent-dark); }
  tr:last-child td { border-bottom: none; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 24px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
  .form-grid label, label.full { display: flex; flex-direction: column; font-size: 0.8rem; color: var(--muted); gap: 4px; }
  label.full { grid-column: 1 / -1; }
  input, select, textarea, button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); }
  textarea { min-height: 60px; width: 100%; }
  button.primary, .panel > form button[type=submit] { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; }
  button.primary:hover, .panel > form button[type=submit]:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .link-btn { background: none; color: var(--accent-dark); border: none; padding: 0; text-decoration: underline; font-weight: 400; cursor: pointer; }
  .link-btn:hover { color: #b23b3b; }
  .inline-form { display: flex; gap: 8px; margin-bottom: 16px; }
  .pick-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
  .pick-list li { display: flex; justify-content: space-between; align-items: center; background: #f6f4ef; border-radius: 6px; padding: 6px 10px; }
  .badge { padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-transform: capitalize; background: #eee; }
  .status-pending { background: #fff3cd; color: #7a5b00; }
  .status-preparing { background: #dbe9ff; color: #1a4d99; }
  .status-ready { background: #d9f2e6; color: #146c43; }
  .status-completed { background: #e2e2e2; color: #444; }
  .status-cancelled { background: #fbdada; color: #a3231e; }
  .status-confirmed { background: #dbe9ff; color: #1a4d99; }
  .status-seated { background: #d9f2e6; color: #146c43; }
  .status-no-show { background: #fbdada; color: #a3231e; }
  .error { color: #a3231e; }
  .success { color: #146c43; }
  .hint { color: var(--muted); font-size: 0.8rem; }
  .conn-box { background: rgba(255,255,255,0.06); border-radius: 8px; padding: 10px; margin-bottom: 16px; }
  .conn-box input { width: 100%; margin-bottom: 6px; font-size: 0.8rem; }
  .conn-status { font-size: 0.78rem; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; display: inline-block; }
  .dot.ok { background: #4caf6d; }
  .dot.bad { background: #d9534f; }
  .loading-veil { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand-name">Spring Valley</div>
    <div class="brand-sub">স্প্রিং ভ্যালী · CRM</div>

    <div class="conn-box">
      <label style="font-size:0.75rem;opacity:0.85;">API URL (PostgreSQL backend)</label>
      <input id="apiUrlInput" placeholder="https://your-api.onrender.com/api" />
      <div style="display:flex; gap:6px;">
        <button id="apiUrlSave" style="flex:1; background:var(--accent); color:#fff; border:none;">Save</button>
      </div>
      <div class="conn-status" id="connStatus" style="margin-top:6px;">
        <span class="dot" id="connDot"></span><span id="connText">Not connected</span>
      </div>
    </div>

    <nav id="nav"></nav>
  </aside>
  <main class="content" id="content"></main>
</div>

<script>
/* ---------- API layer (talks to the PostgreSQL-backed Express API) ---------- */
const API_URL_KEY = 'springValleyApiUrl';

function getApiUrl() {
  return localStorage.getItem(API_URL_KEY) || '';
}
function setApiUrl(url) {
  localStorage.setItem(API_URL_KEY, url.replace(/\/+$/, ''));
}

async function api(path, options = {}) {
  const base = getApiUrl();
  if (!base) throw new Error('Set your API URL in the sidebar first.');
  const res = await fetch(`${base}${path}`, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.error || `Request failed: ${res.status}`);
  return data;
}
const get = (path) => api(path);
const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body) });
const put = (path, body) => api(path, { method: 'PUT', body: JSON.stringify(body) });
const del = (path) => api(path, { method: 'DELETE' });

async function checkConnection() {
  const dot = document.getElementById('connDot');
  const text = document.getElementById('connText');
  const base = getApiUrl();
  if (!base) { dot.className = 'dot'; text.textContent = 'Not connected'; return false; }
  try {
    await get('/health');
    dot.className = 'dot ok';
    text.textContent = 'Connected';
    return true;
  } catch (e) {
    dot.className = 'dot bad';
    text.textContent = 'Cannot reach API';
    return false;
  }
}

/* ---------- Tiny router / render helpers ---------- */
const tabs = [
  { key: 'dashboard', label: 'Dashboard' },
  { key: 'customers', label: 'Customers' },
  { key: 'menu', label: 'Menu' },
  { key: 'orders', label: 'Orders' },
  { key: 'reservations', label: 'Reservations' },
  { key: 'settings', label: 'Restaurant Profile' }
];
let activeTab = 'dashboard';
let cart = []; // [{menuItemId, quantity}] — kept client-side until the order is placed

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = tabs.map(t =>
    `<button data-tab="${t.key}" class="${t.key === activeTab ? 'active' : ''}">${t.label}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
  });
}

async function render() {
  renderNav();
  const content = document.getElementById('content');

  if (!getApiUrl()) {
    content.innerHTML = `<div class="loading-veil">
      <h2>Connect to your database</h2>
      <p>Enter your API URL in the sidebar (the backend you deployed with the PostgreSQL database) and click Save.</p>
    </div>`;
    return;
  }

  content.innerHTML = '<div class="loading-veil">Loading…</div>';
  const connected = await checkConnection();
  if (!connected) {
    content.innerHTML = `<div class="loading-veil">
      <h2 class="error">Can't reach the API</h2>
      <p>Check that the API URL in the sidebar is correct and the backend is running.</p>
    </div>`;
    return;
  }

  const renderers = { dashboard: renderDashboard, customers: renderCustomers, menu: renderMenu, orders: renderOrders, reservations: renderReservations, settings: renderSettings };
  try {
    await renderers[activeTab](content);
  } catch (e) {
    content.innerHTML = `<p class="error">Error: ${esc(e.message)}</p>`;
  }
}

/* ---------- Dashboard ---------- */
async function renderDashboard(root) {
  const s = await get('/dashboard/summary');
  const cards = [
    { label: 'Orders Today', value: s.ordersToday },
    { label: 'Revenue Today', value: `₹${s.revenueToday}` },
    { label: 'Total Customers', value: s.totalCustomers },
    { label: 'Total Orders', value: s.totalOrders },
    { label: 'Total Revenue', value: `₹${s.revenue}` },
    { label: 'Pending Orders', value: s.pendingOrders },
    { label: 'Upcoming Reservations', value: s.upcomingReservations }
  ];

  root.innerHTML = `
    <h1>Dashboard</h1>
    <div class="card-grid">${cards.map(c => `<div class="card"><div class="card-value">${esc(c.value)}</div><div class="card-label">${c.label}</div></div>`).join('')}</div>
    <div class="grid-2">
      <section>
        <h2>Top Selling Items</h2>
        <table><thead><tr><th>Item</th><th>Qty Sold</th><th>Revenue</th></tr></thead>
          <tbody>${s.topItems.length ? s.topItems.map(t => `<tr><td>${esc(t.item_name)}</td><td>${t.total_qty}</td><td>₹${t.total_revenue}</td></tr>`).join('') : '<tr><td colspan="3">No orders yet</td></tr>'}</tbody>
        </table>
      </section>
      <section>
        <h2>Recent Orders</h2>
        <table><thead><tr><th>#</th><th>Type</th><th>Status</th><th>Total</th></tr></thead>
          <tbody>${s.recentOrders.length ? s.recentOrders.map(o => `<tr><td>${o.id}</td><td>${esc(o.order_type)}</td><td><span class="badge status-${o.status}">${o.status}</span></td><td>₹${o.total_amount}</td></tr>`).join('') : '<tr><td colspan="4">No orders yet</td></tr>'}</tbody>
        </table>
      </section>
    </div>
  `;
}

/* ---------- Customers ---------- */
async function renderCustomers(root, query = '') {
  const list = await get(`/customers${query ? `?q=${encodeURIComponent(query)}` : ''}`);

  root.innerHTML = `
    <h1>Customers</h1>
    <form class="inline-form" id="searchForm">
      <input id="searchInput" placeholder="Search by name, phone, or email" value="${esc(query)}" />
      <button type="submit">Search</button>
    </form>
    <section class="panel">
      <h2>Add Customer</h2>
      <p class="error" id="custError"></p>
      <form class="form-grid" id="custForm">
        <input name="name" placeholder="Name *" required />
        <input name="phone" placeholder="Phone" />
        <input name="email" placeholder="Email" />
        <input name="address" placeholder="Address" />
        <input name="notes" placeholder="Notes" />
        <button type="submit">Add Customer</button>
      </form>
    </section>
    <table>
      <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Visits</th><th>Total Spent</th><th></th></tr></thead>
      <tbody>
        ${list.length ? list.map(c => `
          <tr>
            <td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td>
            <td>${c.visit_count}</td><td>₹${c.total_spent}</td>
            <td><button class="link-btn" data-del="${c.id}">Delete</button></td>
          </tr>`).join('') : '<tr><td colspan="6">No customers yet</td></tr>'}
      </tbody>
    </table>
  `;

  root.querySelector('#searchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    renderCustomers(root, root.querySelector('#searchInput').value);
  });

  root.querySelector('#custForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const errEl = root.querySelector('#custError');
    errEl.textContent = '';
    try {
      await post('/customers', {
        name: fd.get('name').trim(),
        phone: fd.get('phone').trim() || null,
        email: fd.get('email').trim() || null,
        address: fd.get('address').trim() || null,
        notes: fd.get('notes').trim() || null,
      });
      renderCustomers(root);
    } catch (err) {
      errEl.textContent = err.message;
    }
  });

  root.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Delete this customer?')) return;
      await del(`/customers/${btn.dataset.del}`);
      renderCustomers(root, query);
    });
  });
}

/* ---------- Menu ---------- */
async function renderMenu(root) {
  const [items, categories] = await Promise.all([get('/menu/items'), get('/menu/categories')]);

  root.innerHTML = `
    <h1>Menu</h1>
    <section class="panel">
      <h2>Add Menu Item</h2>
      <p class="error" id="menuError"></p>
      <form class="form-grid" id="menuForm">
        <input name="name" placeholder="Name *" required />
        <input name="description" placeholder="Description" />
        <input name="price" type="number" min="0" step="1" placeholder="Price *" required />
        <select name="category_id">
          <option value="">No category</option>
          ${categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}
        </select>
        <select name="is_veg">
          <option value="1">Veg</option>
          <option value="0">Non-Veg</option>
        </select>
        <button type="submit">Add Item</button>
      </form>
    </section>
    <table>
      <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Type</th><th>Available</th><th></th></tr></thead>
      <tbody>
        ${items.length ? items.map(i => `
          <tr>
            <td>${esc(i.name)}</td><td>${esc(i.category_name || '-')}</td><td>₹${i.price}</td>
            <td>${i.is_veg ? 'Veg' : 'Non-Veg'}</td>
            <td><button class="link-btn" data-toggle="${i.id}" data-avail="${i.is_available}">${i.is_available ? 'Yes' : 'No'}</button></td>
            <td><button class="link-btn" data-del="${i.id}">Delete</button></td>
          </tr>`).join('') : '<tr><td colspan="6">No menu items yet</td></tr>'}
      </tbody>
    </table>
  `;

  root.querySelector('#menuForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const errEl = root.querySelector('#menuError');
    errEl.textContent = '';
    try {
      await post('/menu/items', {
        name: fd.get('name').trim(),
        description: fd.get('description').trim() || null,
        price: Number(fd.get('price')),
        category_id: fd.get('category_id') ? Number(fd.get('category_id')) : null,
        is_veg: fd.get('is_veg') === '1',
      });
      renderMenu(root);
    } catch (err) {
      errEl.textContent = err.message;
    }
  });

  root.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const isAvailable = btn.dataset.avail === 'true';
      await put(`/menu/items/${btn.dataset.toggle}`, { is_available: !isAvailable });
      renderMenu(root);
    });
  });

  root.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Delete this menu item?')) return;
      await del(`/menu/items/${btn.dataset.del}`);
      renderMenu(root);
    });
  });
}

/* ---------- Orders ---------- */
async function renderOrders(root) {
  const [allItems, orders, customers] = await Promise.all([get('/menu/items'), get('/orders'), get('/customers')]);
  const available = allItems.filter(i => i.is_available);
  const statuses = ['pending', 'preparing', 'ready', 'completed', 'cancelled'];
  const cartTotal = cart.reduce((sum, c) => {
    const item = allItems.find(m => m.id === c.menuItemId);
    return sum + (item ? item.price * c.quantity : 0);
  }, 0);

  root.innerHTML = `
    <h1>Orders</h1>
    <p class="error" id="orderError"></p>
    <section class="panel">
      <h2>New Order</h2>
      <div class="form-grid">
        <select id="orderType">
          <option value="dine-in">Dine-in</option>
          <option value="takeaway">Takeaway</option>
          <option value="delivery">Delivery</option>
        </select>
        <input id="tableNumber" placeholder="Table number" />
        <select id="customerSelect">
          <option value="">Walk-in / no customer</option>
          ${customers.map(c => `<option value="${c.id}">${esc(c.name)}${c.phone ? ' (' + esc(c.phone) + ')' : ''}</option>`).join('')}
        </select>
      </div>
      <div class="grid-2">
        <div>
          <h3>Menu</h3>
          <ul class="pick-list">
            ${available.length ? available.map(m => `<li><span>${esc(m.name)} · ₹${m.price}</span><button data-add="${m.id}">Add</button></li>`).join('') : '<li>No available items</li>'}
          </ul>
        </div>
        <div>
          <h3>Cart</h3>
          <ul class="pick-list" id="cartList">
            ${cart.length ? cart.map(c => {
              const item = allItems.find(m => m.id === c.menuItemId);
              return `<li><span>${esc(item?.name)} x${c.quantity}</span><button class="link-btn" data-remove="${c.menuItemId}">Remove</button></li>`;
            }).join('') : '<li>No items yet</li>'}
          </ul>
          <p><strong>Total: ₹${cartTotal}</strong></p>
          <button id="placeOrderBtn" ${cart.length === 0 ? 'disabled' : ''}>Place Order</button>
        </div>
      </div>
    </section>
    <table>
      <thead><tr><th>#</th><th>Type</th><th>Table</th><th>Total</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${orders.length ? [...orders].sort((a, b) => b.id - a.id).map(o => `
          <tr>
            <td>${o.id}</td><td>${esc(o.order_type)}</td><td>${esc(o.table_number || '-')}</td>
            <td>₹${o.total_amount}</td>
            <td><span class="badge status-${o.status}">${o.status}</span></td>
            <td>
              <select data-status="${o.id}">
                ${statuses.map(s => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </td>
          </tr>`).join('') : '<tr><td colspan="6">No orders yet</td></tr>'}
      </tbody>
    </table>
  `;

  root.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.add);
      const existing = cart.find(c => c.menuItemId === id);
      if (existing) existing.quantity += 1; else cart.push({ menuItemId: id, quantity: 1 });
      renderOrders(root);
    });
  });

  root.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      cart = cart.filter(c => c.menuItemId !== Number(btn.dataset.remove));
      renderOrders(root);
    });
  });

  const placeBtn = root.querySelector('#placeOrderBtn');
  if (placeBtn) placeBtn.addEventListener('click', async () => {
    if (cart.length === 0) return;
    const errEl = root.querySelector('#orderError');
    errEl.textContent = '';
    const customerId = root.querySelector('#customerSelect').value ? Number(root.querySelector('#customerSelect').value) : null;
    const orderType = root.querySelector('#orderType').value;
    const tableNumber = root.querySelector('#tableNumber').value || null;

    try {
      await post('/orders', {
        customer_id: customerId,
        order_type: orderType,
        table_number: tableNumber,
        items: cart.map(c => ({ menu_item_id: c.menuItemId, quantity: c.quantity })),
      });
      cart = [];
      renderOrders(root);
    } catch (err) {
      errEl.textContent = err.message;
    }
  });

  root.querySelectorAll('[data-status]').forEach(sel => {
    sel.addEventListener('change', async () => {
      await put(`/orders/${sel.dataset.status}/status`, { status: sel.value });
      renderOrders(root);
    });
  });
}

/* ---------- Reservations ---------- */
async function renderReservations(root) {
  const [reservations, customers] = await Promise.all([get('/reservations'), get('/customers')]);
  const statuses = ['confirmed', 'seated', 'cancelled', 'completed', 'no-show'];

  root.innerHTML = `
    <h1>Reservations</h1>
    <section class="panel">
      <h2>New Reservation</h2>
      <p class="error" id="resError"></p>
      <form class="form-grid" id="resForm">
        <select name="customer_id">
          <option value="">Walk-in / no customer</option>
          ${customers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}
        </select>
        <input name="party_size" type="number" min="1" value="2" placeholder="Party size" />
        <input name="reservation_time" type="datetime-local" required />
        <input name="notes" placeholder="Notes" />
        <button type="submit">Book</button>
      </form>
    </section>
    <table>
      <thead><tr><th>Time</th><th>Party</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${reservations.length ? [...reservations].sort((a, b) => new Date(b.reservation_time) - new Date(a.reservation_time)).map(r => `
          <tr>
            <td>${new Date(r.reservation_time).toLocaleString()}</td><td>${r.party_size}</td>
            <td><span class="badge status-${r.status}">${r.status}</span></td>
            <td>
              <select data-status="${r.id}">
                ${statuses.map(s => `<option value="${s}" ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </td>
          </tr>`).join('') : '<tr><td colspan="4">No reservations yet</td></tr>'}
      </tbody>
    </table>
  `;

  root.querySelector('#resForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const errEl = root.querySelector('#resError');
    errEl.textContent = '';
    try {
      await post('/reservations', {
        customer_id: fd.get('customer_id') ? Number(fd.get('customer_id')) : null,
        party_size: Number(fd.get('party_size')) || 1,
        reservation_time: new Date(fd.get('reservation_time')).toISOString(),
        notes: fd.get('notes').trim() || null,
      });
      renderReservations(root);
    } catch (err) {
      errEl.textContent = err.message;
    }
  });

  root.querySelectorAll('[data-status]').forEach(sel => {
    sel.addEventListener('change', async () => {
      await put(`/reservations/${sel.dataset.status}/status`, { status: sel.value });
      renderReservations(root);
    });
  });
}

/* ---------- Settings / Restaurant Profile ---------- */
async function renderSettings(root, savedMsg = '') {
  const p = await get('/restaurant');
  const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
  const hours = p.opening_hours || {};

  root.innerHTML = `
    <h1>Restaurant Profile</h1>
    ${savedMsg ? `<p class="success">${savedMsg}</p>` : ''}
    <p class="error" id="profileError"></p>
    <form class="panel" id="profileForm">
      <div class="form-grid">
        <label>Name<input name="name" value="${esc(p.name)}" /></label>
        <label>Local Name<input name="name_local" value="${esc(p.name_local)}" /></label>
        <label>Cuisine<input name="cuisine" value="${esc(p.cuisine)}" /></label>
        <label>Category<input name="category" value="${esc(p.category)}" /></label>
        <label>Phone<input name="phone" value="${esc(p.phone)}" /></label>
        <label>Website<input name="website" value="${esc(p.website)}" /></label>
        <label>Price Range<input name="price_range" value="${esc(p.price_range)}" /></label>
        <label>Rating<input name="rating" type="number" step="0.1" value="${p.rating}" /></label>
        <label>Rating Count<input name="rating_count" type="number" value="${p.rating_count}" /></label>
        <label>Latitude<input name="latitude" type="number" step="0.000001" value="${p.latitude}" /></label>
        <label>Longitude<input name="longitude" type="number" step="0.000001" value="${p.longitude}" /></label>
      </div>
      <label class="full">Address<textarea name="address">${esc(p.address)}</textarea></label>
      <label class="full">Notes<textarea name="notes">${esc(p.notes)}</textarea></label>
      <h2>Opening Hours</h2>
      <div class="form-grid">
        ${days.map(d => `<label style="text-transform:capitalize">${d}<input name="hours_${d}" placeholder="09:00-21:00 or Closed" value="${esc(hours[d] || '')}" /></label>`).join('')}
      </div>
      <button type="submit" style="margin-top:16px;">Save Profile</button>
    </form>
  `;

  root.querySelector('#profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const errEl = root.querySelector('#profileError');
    errEl.textContent = '';
    const opening_hours = {};
    days.forEach(d => { opening_hours[d] = fd.get('hours_' + d); });
    try {
      await put('/restaurant', {
        name: fd.get('name'), name_local: fd.get('name_local'), cuisine: fd.get('cuisine'),
        category: fd.get('category'), phone: fd.get('phone'), website: fd.get('website'),
        price_range: fd.get('price_range'), address: fd.get('address'), notes: fd.get('notes'),
        rating: Number(fd.get('rating')), rating_count: Number(fd.get('rating_count')),
        latitude: Number(fd.get('latitude')), longitude: Number(fd.get('longitude')),
        opening_hours,
      });
      renderSettings(root, 'Saved.');
    } catch (err) {
      errEl.textContent = err.message;
    }
  });
}

/* ---------- Boot ---------- */
document.getElementById('apiUrlInput').value = getApiUrl();
document.getElementById('apiUrlSave').addEventListener('click', () => {
  setApiUrl(document.getElementById('apiUrlInput').value.trim());
  render();
});
render();
</script>
